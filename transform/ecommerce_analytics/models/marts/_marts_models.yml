
version: 2

models:

  - name: fct_orders
    description: "One row per order, containing order-level business metrics."
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null

  - name: fct_order_items
    description: "One row per order item, containing product-level sales metrics."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - order_item_id
    columns:
      - name: order_id
        data_tests:
          - not_null
      - name: order_item_id
        data_tests:
          - not_null
      - name: product_id
        data_tests:
          - not_null

  - name: fct_payments
    description: "One row per payment record associated with an order."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - payment_sequential
    columns:
      - name: order_id
        data_tests:
          - not_null
      - name: payment_sequential
        data_tests:
          - not_null
      - name: payment_value
        data_tests:
          - not_null

  - name: dim_customers
    description: "Customer attributes, with one row per customer record."
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
      - name: customer_unique_id
        data_tests:
          - not_null

  - name: dim_products
    description: "Product attributes and translated product categories."
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null

  - name: dim_sellers
    description: "Seller attributes and geographic information."
    columns:
      - name: seller_id
        data_tests:
          - unique
          - not_null
