
version: 2

models:

  # ==========================================
  # 1. ENRICHED ORDER ITEMS
  # Grain: One row per order item
  # ==========================================

  - name: int_order_items_enriched
    description: "Order items enriched with order, product, seller and category information."

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - order_item_id

    columns:
      - name: order_id
        description: "Identifier of the order."
        data_tests:
          - not_null

      - name: order_item_id
        description: "Sequential item identifier within an order."
        data_tests:
          - not_null

      - name: product_id
        description: "Identifier of the purchased product."
        data_tests:
          - not_null

      - name: seller_id
        description: "Identifier of the seller."
        data_tests:
          - not_null

      - name: price
        description: "Price of the purchased product."
        data_tests:
          - not_null

      - name: freight_value
        description: "Shipping cost associated with the order item."
        data_tests:
          - not_null


  # ==========================================
  # 2. ENRICHED ORDERS
  # Grain: One row per order
  # ==========================================

  - name: int_orders_enriched
    description: "Orders enriched with customer, item, payment and review metrics."

    columns:
      - name: order_id
        description: "Unique identifier for an order."
        data_tests:
          - unique
          - not_null

      - name: customer_id
        description: "Customer identifier associated with the order."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: order_status
        description: "Current status of the order."
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - delivered
                  - shipped
                  - canceled
                  - unavailable
                  - invoiced
                  - processing
                  - created
                  - approved

      - name: total_order_items
        description: "Total number of items in the order."
        data_tests:
          - not_null

      - name: total_payment_value
        description: "Total recorded payment value for the order."
        data_tests:
          - not_null


  # ==========================================
  # 3. CUSTOMER ORDERS
  # Grain: One row per actual customer
  # ==========================================

  - name: int_customer_orders
    description: "Customer-level purchasing metrics and order behaviour."

    columns:
      - name: customer_unique_id
        description: "Unique identifier representing an actual customer."
        data_tests:
          - unique
          - not_null

      - name: total_orders
        description: "Total number of orders placed by the customer."
        data_tests:
          - not_null

      - name: delivered_orders
        description: "Number of delivered orders."
        data_tests:
          - not_null

      - name: cancelled_orders
        description: "Number of cancelled orders."
        data_tests:
          - not_null

      - name: total_customer_spend
        description: "Total recorded payment value across customer orders."
        data_tests:
          - not_null
